<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>FATE visual QA (not deployed)</title>
<style>body{margin:0;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);background:#15151a;color:#ddd;font:11px Arial,sans-serif}nav{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 10px;box-sizing:border-box}button,select{font:11px Arial;background:#30303a;color:#fff;border:1px solid #555;padding:6px;cursor:pointer}button:disabled{opacity:.5}output{width:100%;height:30px;overflow:hidden;font:10px/1.5 monospace;overflow-wrap:anywhere}iframe{display:block;border:0;width:100%;height:100%;min-height:0}#report{position:fixed;z-index:2;bottom:40px;left:20px;max-width:90vw;background:#260000;white-space:pre-wrap}#report:empty{display:none}details{position:fixed;z-index:3;right:8px;bottom:8px;padding:7px;background:#15151af2;max-width:90vw;max-height:40vh;overflow:auto}pre{font:10px/1.6 monospace;white-space:pre-wrap}</style></head>
<body><nav aria-label="Visual test controls">
<select id="mode" aria-label="Rendering mode"><option value="motion">Motion</option><option value="reduced">Reduced motion</option><option value="no-webgl">No WebGL</option><option value="no-gsap">No GSAP</option></select>
<button id="load">Load case</button><button data-score="0">Silence</button><button data-score="17">Blade reveal</button><button data-score="23.3">Full blade</button><button data-score="38.4">Child</button><button data-score="46.3">One hand</button><button data-score="50.7">Three hands</button><button data-score="63.7">Thousand</button><button data-score="69">Silent hands</button><button data-score="76.5">Ascension</button><button data-score="80.5">White child</button><button data-score="83.5">Whiteout</button><button data-score="85.8">Flash bridge</button><button data-cue="100">Ignition</button><button data-cue="105">Dissolve</button><button data-cue="106">Flood</button><button data-cue="112">Engulf</button><button data-cue="118">White world</button><button data-cue="120">White void</button><button data-cue="138">Katana fall</button><button data-cue="160">Architecture</button><button data-cue="173">Services</button><button data-cue="186">Craft</button><button data-cue="200">Ground</button><button data-cue="210">Sword rain begins</button><button data-cue="220">Sword rain</button><button data-cue="238">Planted field</button><button data-cue="248">Flatten</button><button data-cue="253">Flat horizon</button><button data-cue="258">Ending</button><button id="lose-context">Lose context</button><button id="regression">Run story checks</button><output id="metrics">Loading…</output></nav>
<iframe title="FATE test viewport" id="preview"></iframe><pre id="report"></pre><details><summary>Story check results</summary><pre id="checks"></pre></details><script src="visual.js"></script></body></html>
