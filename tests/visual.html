<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FATE visual QA (not deployed)</title>
<style>body{margin:0;background:#15151a;color:#ddd;font:11px Arial,sans-serif}nav{height:62px;display:flex;align-items:center;gap:7px;overflow-x:auto;padding:5px 10px;box-sizing:border-box}button,select{flex-shrink:0;font:11px Arial;background:#30303a;color:#fff;border:1px solid #555;padding:7px;cursor:pointer}output{font:10px monospace;white-space:nowrap}iframe{display:block;border:0;width:100%;height:calc(100vh - 62px)}#report{position:fixed;bottom:40px;left:20px;max-width:600px;background:#260000;white-space:pre-wrap}#report:empty{display:none}</style></head>
<body><nav aria-label="Visual test controls">
<select id="mode" aria-label="Rendering mode"><option value="motion">Motion</option><option value="reduced">Reduced motion</option><option value="no-webgl">No WebGL</option><option value="no-gsap">No GSAP</option></select>
<button id="load">Load case</button><button data-progress="0">Silence</button><button data-progress=".17">Blade reveal</button><button data-progress=".233">Full blade</button><button data-progress=".384">Child</button><button data-progress=".463">One hand</button><button data-progress=".507">Three hands</button><button data-progress=".637">Thousand</button><button data-progress=".69">Silent hands</button><button data-progress=".765">Ascension</button><button data-progress=".805">White child</button><button data-progress=".835">Whiteout</button><button data-progress=".98">Ending</button><button id="lose-context">Lose context</button><output id="metrics">Loading…</output></nav>
<iframe title="FATE test viewport" id="preview"></iframe><pre id="report"></pre><script src="visual.js"></script></body></html>
