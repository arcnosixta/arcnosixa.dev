<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Main motion QA (not deployed)</title>
<style>
body{margin:0;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);background:#15151a;color:#ddd;font:11px Arial,sans-serif}nav{min-height:90px;display:flex;align-content:center;align-items:center;flex-wrap:wrap;gap:5px;padding:5px 10px;box-sizing:border-box}button,select{font:11px Arial;background:#30303a;color:#fff;border:1px solid #555;padding:6px}output{width:100%;font:10px monospace}iframe{display:block;border:0;width:100%;height:100%;min-height:0}#errors{position:fixed;bottom:10px;left:10px;background:#300;white-space:pre-wrap}#errors:empty{display:none}details{position:fixed;bottom:10px;right:10px;background:#17171eee;padding:8px;max-width:90vw;max-height:35vh;overflow:auto}pre{font:10px monospace;margin:4px 0}
</style></head><body>
<nav aria-label="Main motion test controls">
<select id="mode" aria-label="Test mode"><option value="motion">Motion</option><option value="reduced">Reduced motion</option><option value="no-gsap">No GSAP</option><option value="studio">Studio</option><option value="atelier">Atelier</option></select><button id="load">Load case</button>
<select id="scene" aria-label="Scene"><option value="creation-chapter">Creation</option><option value="scene-ciel">Ciel</option><option value="scene-rigforge">RigForge</option><option value="scene-osint-portal">OSINT</option><option value="motion-about">About</option><option value="spread-author">Author ink</option><option value="motion-skills">Skills heading</option><option value="motion-skill-0">Skill row</option><option value="motion-path">History</option><option value="motion-contact">Contact</option><option value="spread-finale">Contact title</option></select>
<button data-progress="0">Start</button><button data-progress=".5">Middle</button><button data-progress="1">End</button><button id="language">RU / EN</button><button id="filter">Filter / all</button><button id="accordion">Details</button><button id="replay">Replay intro</button><button id="audit">Audit</button><button id="regression">Run regression</button><output id="metrics">Loading…</output>
</nav><iframe id="preview" title="Main motion test viewport"></iframe><pre id="errors"></pre><details><summary>Geometry report</summary><pre id="report"></pre><pre id="checks"></pre></details><script src="main-visual.js"></script></body></html>
